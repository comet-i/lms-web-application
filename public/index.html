<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberPeace Foundation - LMS</title>
    <meta name="description" content="CyberPeace Foundation Learning Management System." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Login screen -->
    <main id="login-view" class="login-shell" hidden>
      <div class="login-container">
        <div class="login-header">
          <svg class="brand-logo-large" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="doveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#4A9FD8;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#2B5A8C;stop-opacity:1" />
              </linearGradient>
            </defs>
            
            <!-- Outer double rings -->
            <circle cx="110" cy="110" r="105" fill="none" stroke="#003D82" stroke-width="9"/>
            <circle cx="110" cy="110" r="90" fill="none" stroke="#003D82" stroke-width="7"/>
            
            <!-- Connection point circles -->
            <circle cx="110" cy="20" r="7" fill="#003D82"/>
            <circle cx="182" cy="165" r="7" fill="#003D82"/>
            <circle cx="38" cy="165" r="7" fill="#003D82"/>
            
            <!-- Connecting lines (forming triangle) -->
            <line x1="110" y1="27" x2="110" y2="110" stroke="#003D82" stroke-width="8" stroke-linecap="round"/>
            <line x1="182" y1="165" x2="110" y2="110" stroke="#003D82" stroke-width="8" stroke-linecap="round"/>
            <line x1="38" y1="165" x2="110" y2="110" stroke="#003D82" stroke-width="8" stroke-linecap="round"/>
            
            <!-- Blue dove with digital elements -->
            <g transform="translate(110, 105)">
              <!-- Dove body -->
              <ellipse cx="0" cy="5" rx="16" ry="24" fill="url(#doveGradient)"/>
              
              <!-- Dove head -->
              <circle cx="0" cy="-15" r="12" fill="url(#doveGradient)"/>
              
              <!-- Dove eye -->
              <circle cx="5" cy="-17" r="2" fill="#001f4d"/>
              
              <!-- Dove beak -->
              <path d="M 10 -15 L 18 -15 L 14 -11 Z" fill="#003D82"/>
              
              <!-- Left wing -->
              <path d="M -8 0 Q -26 -5 -32 8 Q -28 15 -12 12 Q -6 10 -5 5 Z" fill="url(#doveGradient)"/>
              
              <!-- Left wing digital pattern -->
              <text x="-24" y="2" font-size="2.5" fill="#2B5A8C" opacity="0.9" font-family="monospace">01</text>
              <text x="-22" y="8" font-size="2" fill="#2B5A8C" opacity="0.8" font-family="monospace">10</text>
              <text x="-18" y="5" font-size="2" fill="#2B5A8C" opacity="0.7" font-family="monospace">1</text>
              <text x="-20" y="11" font-size="2" fill="#2B5A8C" opacity="0.7" font-family="monospace">0</text>
              
              <!-- Right wing -->
              <path d="M 8 0 Q 26 -5 32 8 Q 28 15 12 12 Q 6 10 5 5 Z" fill="url(#doveGradient)"/>
              
              <!-- Right wing digital pattern -->
              <text x="18" y="2" font-size="2.5" fill="#2B5A8C" opacity="0.9" font-family="monospace">01</text>
              <text x="20" y="8" font-size="2" fill="#2B5A8C" opacity="0.8" font-family="monospace">10</text>
              
              <!-- Tail feathers -->
              <path d="M -6 22 Q -10 32 -6 38 Q 6 38 10 32 Q 6 22 0 22 Z" fill="url(#doveGradient)"/>
            </g>
          </svg>
          <h1>CyberPeace Foundation</h1>
          <p>Learning Management System</p>
        </div>
      </div>
      <section class="login-card">
        <form id="login-form" class="login-form">
          <label>
            <span>Email</span>
            <input type="email" id="email" required autocomplete="username" />
          </label>
          <label>
            <span>Password</span>
            <input type="password" id="password" required autocomplete="current-password" />
          </label>
          <button type="submit" class="btn btn-primary btn-block">Sign In</button>
          <p id="login-error" class="form-error" role="alert"></p>
        </form>
      </section>
    </main>

    <!-- App shell -->
    <div id="app-view" class="app-shell" hidden>
      <aside class="sidebar">
        <div class="sidebar-brand">
          <svg class="brand-logo-small" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="doveSideGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#4A9FD8;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#2B5A8C;stop-opacity:1" />
              </linearGradient>
            </defs>
            
            <!-- Outer double rings -->
            <circle cx="32" cy="32" r="30" fill="none" stroke="white" stroke-width="2.5"/>
            <circle cx="32" cy="32" r="26" fill="none" stroke="white" stroke-width="2"/>
            
            <!-- Connection point circles -->
            <circle cx="32" cy="8" r="2" fill="white"/>
            <circle cx="52" cy="50" r="2" fill="white"/>
            <circle cx="12" cy="50" r="2" fill="white"/>
            
            <!-- Connecting lines -->
            <line x1="32" y1="10" x2="32" y2="32" stroke="white" stroke-width="2.2"/>
            <line x1="52" y1="50" x2="32" y2="32" stroke="white" stroke-width="2.2"/>
            <line x1="12" y1="50" x2="32" y2="32" stroke="white" stroke-width="2.2"/>
            
            <!-- Blue dove -->
            <g transform="translate(32, 32)">
              <!-- Dove body -->
              <ellipse cx="0" cy="2" rx="4.5" ry="7" fill="url(#doveSideGradient)"/>
              
              <!-- Dove head -->
              <circle cx="0" cy="-4" r="3.2" fill="url(#doveSideGradient)"/>
              
              <!-- Dove eye -->
              <circle cx="1.2" cy="-4.5" r="0.6" fill="#001f4d"/>
              
              <!-- Dove beak -->
              <path d="M 2.5 -4 L 5 -4 L 3.5 -2.5 Z" fill="white"/>
              
              <!-- Left wing -->
              <path d="M -1.5 0.5 Q -6 -1 -8.5 2 Q -7.5 4 -3 3 Q -0.5 2.5 0 0.5 Z" fill="url(#doveSideGradient)"/>
              
              <!-- Right wing -->
              <path d="M 1.5 0.5 Q 6 -1 8.5 2 Q 7.5 4 3 3 Q 0.5 2.5 0 0.5 Z" fill="url(#doveSideGradient)"/>
              
              <!-- Tail -->
              <path d="M -1.5 7 Q -2.5 10 -1.5 11.5 Q 1.5 11.5 2.5 10 Q 1.5 7 0 7 Z" fill="url(#doveSideGradient)"/>
            </g>
          </svg>
          <div class="brand-text">
            <span class="brand-name">CyberPeace</span>
            <span class="brand-subtitle">Foundation</span>
          </div>
        </div>

        <nav class="nav">
          <p class="nav-group-label">Main Platform</p>
          <button class="nav-item" data-view="dashboard">Dashboard</button>
          <button class="nav-item" data-view="courses">Courses</button>
          <button class="nav-item" data-view="enrollments">Enrollments</button>
          <button class="nav-item" data-view="users">Users</button>
          <button class="nav-item" data-view="subscriptions">Subscriptions</button>

          <p class="nav-group-label">Diagnostic View</p>
          <button class="nav-item" data-view="session">Session State</button>
          <button class="nav-item" data-view="database">Database Snapshot</button>
        </nav>

        <div class="sidebar-footer">
          <div class="user-chip">
            <span id="user-initials" class="user-initials">--</span>
            <span class="user-meta">
              <strong id="user-name">User</strong>
              <small id="user-role">Role</small>
            </span>
          </div>
          <button id="logout-btn" class="btn btn-ghost btn-block">Sign Out</button>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <h2 id="view-title">Dashboard</h2>
          <span id="view-subtitle" class="topbar-subtitle"></span>
        </header>
        <section id="view-root" class="view-root"></section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
