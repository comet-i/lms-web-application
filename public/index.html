<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple LMS</title>
    <meta name="description" content="A lightweight Learning Management System." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Login screen -->
    <main id="login-view" class="login-shell" hidden>
      <section class="login-card">
        <div class="login-brand">
          <span class="brand-mark">LMS</span>
          <h1>Simple LMS</h1>
          <p>Sign in to your learning workspace</p>
        </div>
        <form id="login-form" class="login-form">
          <label>
            <span>Email</span>
            <input type="email" id="email" required autocomplete="username" />
          </label>
          <label>
            <span>Password</span>
            <input type="password" id="password" required autocomplete="current-password" />
          </label>
          <button type="submit" class="btn btn-primary btn-block">Sign In</button>
          <p id="login-error" class="form-error" role="alert"></p>
        </form>
      </section>
    </main>

    <!-- App shell -->
    <div id="app-view" class="app-shell" hidden>
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark">LMS</span>
          <span class="brand-name">Simple LMS</span>
        </div>

        <nav class="nav">
          <p class="nav-group-label">Main Platform</p>
          <button class="nav-item" data-view="dashboard">Dashboard</button>
          <button class="nav-item" data-view="courses">Courses</button>
          <button class="nav-item" data-view="enrollments">Enrollments</button>
          <button class="nav-item" data-view="users">Users</button>

          <p class="nav-group-label">Diagnostic View</p>
          <button class="nav-item" data-view="session">Session State</button>
          <button class="nav-item" data-view="database">Database Snapshot</button>
        </nav>

        <div class="sidebar-footer">
          <div class="user-chip">
            <span id="user-initials" class="user-initials">--</span>
            <span class="user-meta">
              <strong id="user-name">User</strong>
              <small id="user-role">Role</small>
            </span>
          </div>
          <button id="logout-btn" class="btn btn-ghost btn-block">Sign Out</button>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <h2 id="view-title">Dashboard</h2>
          <span id="view-subtitle" class="topbar-subtitle"></span>
        </header>
        <section id="view-root" class="view-root"></section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
